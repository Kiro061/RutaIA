<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RutaIA | Iniciar sesión</title>

    <link rel="stylesheet" href="../css/login.css">

</head>
<body>
<header class="navbar">

    <div class="logo">

        <a href="../index.html">
            RutaIA
        </a>

    </div>


    <nav>

        <a href="../index.html">
            Inicio
        </a>

        <a href="catalogo.html">
            Catálogo
        </a>

        <a href="consulta.html">
            Consulta
        </a>

        <a href="registro.html" class="btn-nav">
            Registrarse
        </a>

    </nav>

</header>



<main class="auth-container">


    <section class="auth-card">


        <div class="auth-header">

            <span class="section-tag">
                Bienvenido a RutaIA
            </span>


            <h1>
                Iniciar sesión
            </h1>


            <p>
                Ingresa a tu cuenta para continuar.
            </p>

        </div>



        <form id="loginForm">


            <div class="form-group">

                <label for="correo">
                    Correo electrónico
                </label>


                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>



            <button
                type="submit"
                class="btn-primary btn-full"
            >
                Iniciar sesión
            </button>


        </form>

        <p
            id="loginMessage"
            class="form-message"
        ></p>

        <div class="auth-footer">
            <p>
                ¿No tienes una cuenta?
                <a href="registro.html">
                    Crear cuenta
                </a>
            </p>
        </div>

    </section>
</main>
<script src="js/login.js"></script>
</body>
</html>
