<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00E5FF; stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0056b3; stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Globo terráqueo -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#003366" stroke-width="5"/>
    <ellipse cx="50" cy="50" rx="18" ry="42" fill="none" stroke="#003366" stroke-width="3"/>
    <line x1="8" y1="50" x2="92" y2="50" stroke="#003366" stroke-width="3"/>
    <line x1="50" y1="8" x2="50" y2="92" stroke="#003366" stroke-width="3"/>

    <!-- Nodos de conexión (Red) -->
    <circle cx="40" cy="35" r="5" fill="url(#logoGrad)" />
    <circle cx="70" cy="25" r="7" fill="url(#logoGrad)" />
    <circle cx="55" cy="65" r="6" fill="url(#logoGrad)" />

    <!-- Líneas de la red -->
    <line x1="40" y1="35" x2="70" y2="25" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="70" y1="25" x2="55" y2="65" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="65" x2="40" y2="35" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>